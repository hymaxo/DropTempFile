services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - uploads:/app/data
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  uploads:
