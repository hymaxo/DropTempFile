<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>DropTempFile</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">DropTempFile<span aria-hidden="true">↗</span></a><span class="limit">100 MB max / 60 min</span></header>
<main><section id="upload-view"><h1>Drop it.<br><span>Share it.</span></h1><p class="intro">A file. A link. Gone in 60 minutes.</p><label id="drop" for="file"><span class="arrow" aria-hidden="true">↓</span><strong>Drop a file here</strong><span>or choose a file <span aria-hidden="true">↗</span></span><input type="file" id="file" aria-label="Choose a file to upload"></label><progress id="progress" max="100" value="0" hidden aria-label="Upload progress"></progress><p id="status" role="status" aria-live="polite"></p></section>
<section id="file-view" hidden><p class="eyebrow" id="file-state">Ready to share</p><h1 class="file-title" id="filename"></h1><p id="details"></p><div id="share"><label for="link">Share link</label><div class="link-row"><input id="link" readonly><button id="copy">Copy link ↗</button></div><p class="note">Anyone with this link can download the file.</p></div><a class="download" id="download">Download file ↓</a><p id="copy-status" role="status"></p><a class="again" href="/">Upload another file ↗</a></section></main><footer><span>Temporary by design.</span><span>Files are automatically deleted.</span></footer></body></html>
